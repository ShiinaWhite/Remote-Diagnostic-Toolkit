name: RDT production CI (no real API)

on:
  push:
    branches: [main, v0.2-runtime-qualification, v0.3-production-runtime]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Locked restore
        run: dotnet restore Rdt.slnx --locked-mode
      - name: Release build
        run: dotnet build Rdt.slnx -c Release --no-restore
      - name: Foundation and production runtime tests (no API key)
        run: dotnet test Rdt.slnx -c Release --no-build --no-restore
      - name: Secret scan (public candidates and available Git objects)
        run: python scripts/secret-scan.py
      - name: Locked restore of developer qualification bridge
        run: dotnet restore tools/Rdt.Qualification/Rdt.Qualification.csproj --locked-mode
      - name: Build developer qualification bridge
        run: dotnet build tools/Rdt.Qualification/Rdt.Qualification.csproj -c Release --no-restore
      - name: Qualification harness self tests (no candidate runtime or API key)
        run: python -m unittest discover -s scripts/runtime-qualification -p test_harness.py -v
      - name: Locked restore of developer YOLO qualification bridge
        run: dotnet restore tools/Rdt.YoloQualification/Rdt.YoloQualification.csproj --locked-mode
      - name: Build developer YOLO qualification bridge
        run: dotnet build tools/Rdt.YoloQualification/Rdt.YoloQualification.csproj -c Release --no-restore
      - name: YOLO evidence evaluator self tests (no candidate runtime or API key)
        run: python -m unittest discover -s scripts/runtime-qualification -p test_yolo.py -v
      - name: Locked restore of developer lifecycle qualification bridge
        run: dotnet restore tools/Rdt.LifecycleQualification/Rdt.LifecycleQualification.csproj --locked-mode
      - name: Build developer lifecycle qualification bridge
        run: dotnet build tools/Rdt.LifecycleQualification/Rdt.LifecycleQualification.csproj -c Release --no-restore
      - name: Native Windows Job API self tests (no candidate runtime or API key)
        run: dotnet tools/Rdt.LifecycleQualification/bin/Release/net10.0/Rdt.LifecycleQualification.dll self-test
      - name: Lifecycle and Unicode evidence self tests (no candidate runtime or API key)
        run: python -m unittest discover -s scripts/runtime-qualification -p test_lifecycle.py -v
